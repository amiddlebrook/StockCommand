name = "stockbrain"
main = "worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[ai]
binding = "AI"

# Observability configuration
[observability]
  [observability.logs]
  enabled = false
  head_sampling_rate = 1
  invocation_logs = true
  persist = true

# Environment variables
[vars]
# App configuration
APP_NAME = "StockBrain"
APP_VERSION = "1.0.0"
ENVIRONMENT = "production"

# CORS configuration
ALLOWED_ORIGINS = "https://stockbrain.averymiddlebrook2014.workers.dev,https://localhost:3000"

# Rate limiting
RATE_LIMIT_REQUESTS = "100"
RATE_LIMIT_WINDOW = "60"

# Cache configuration
CACHE_TTL = "3600"

# Stock API configuration
DEFAULT_STOCK_PROVIDER = "alphavantage"
STOCK_API_TIMEOUT = "5000"

# The following secrets need to be configured in Cloudflare dashboard or via CLI:
# - OPENAI_API_KEY
# - GEMINI_API_KEY  
# - CLAUDE_API_KEY
# - OPENROUTER_QWEN3_CODER_API_KEY
# - OPENROUTER_DEEPSEEK_R1T2_API_KEY
# - OPENROUTER_DEEPSEEK_CHAT_API_KEY
# - OPENROUTER_MINIMAX_M2_API_KEY
# - OPENROUTER_GLM_45_AIR_API_KEY
# - OPENROUTER_QWEN3_235B_API_KEY
# - ODDS_API_KEY
# - ALPHA_VANTAGE_API_KEY
# - FINNHUB_API_KEY
# - IEXCLOUD_API_KEY

# KV Namespaces for caching
[[kv_namespaces]]
binding = "STOCK_CACHE_KV"
id = "fa0ae101b0174f93a89abf2cfaa68f9f"
preview_id = "fa0ae101b0174f93a89abf2cfaa68f9f"

[[kv_namespaces]]
binding = "USER_SESSIONS_KV"
id = "10f7f3c4a0ed4c069ce1802d06393ca8"
preview_id = "10f7f3c4a0ed4c069ce1802d06393ca8"

# D1 Database for user data and stock analysis storage
[[d1_databases]]
binding = "DB"
database_name = "stockbrain-db"
database_id = "4827eede-850e-469c-9ea4-4b17a79408aa"

# R2 Storage for file uploads and images
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "stockbrain-storage"

# Queue for background stock data processing
[[queues.producers]]
binding = "STOCK_DATA_QUEUE"
queue = "stockbrain-queue"

# Note: Queue consumer handler needs to be implemented
# [[queues.consumers]]
# queue = "stockbrain-queue"

# Analytics Engine for usage tracking
[[analytics_engine_datasets]]
binding = "ANALYTICS"
