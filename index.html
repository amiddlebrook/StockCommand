<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockCommand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'fadeIn': 'fadeIn 0.5s ease-in-out',
            'gradient': 'gradient 15s ease infinite',
            'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
            'scan-line': 'scanLine 3s linear infinite',
            'float': 'float 6s ease-in-out infinite',
            'spin-slow': 'spin 20s linear infinite',
            'neural-pulse': 'neuralPulse 1.5s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            gradient: {
              '0%, 100%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' },
            },
            pulseGlow: {
              '0%, 100%': { boxShadow: '0 0 5px rgba(6, 182, 212, 0.3)' },
              '50%': { boxShadow: '0 0 20px rgba(6, 182, 212, 0.6), 0 0 40px rgba(6, 182, 212, 0.3)' },
            },
            scanLine: {
              '0%': { transform: 'translateY(-100%)' },
              '100%': { transform: 'translateY(100vh)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            neuralPulse: {
              '0%, 100%': { opacity: '0.3', transform: 'scale(1)' },
              '50%': { opacity: '1', transform: 'scale(1.05)' },
            },
          },
          backgroundImage: {
            'aegis-gradient': 'linear-gradient(135deg, #0f172a 0%, #1e1b4b 25%, #0f172a 50%, #164e63 75%, #0f172a 100%)',
            'grid-pattern': 'linear-gradient(rgba(6, 182, 212, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(6, 182, 212, 0.03) 1px, transparent 1px)',
          },
        },
      },
    }
  </script>
  <style>
    body {
      font-family: 'IBM Plex Mono', monospace;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 25%, #0f172a 50%, #164e63 75%, #0f172a 100%);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* AEGIS Grid Overlay */
    .aegis-grid {
      background-image:
        linear-gradient(rgba(6, 182, 212, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(6, 182, 212, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    /* HUD Corner Brackets (System-Zero-Tactical inspired) */
    .hud-brackets {
      position: relative;
    }

    .hud-brackets::before,
    .hud-brackets::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: rgba(6, 182, 212, 0.5);
      border-style: solid;
      pointer-events: none;
    }

    .hud-brackets::before {
      top: 0;
      left: 0;
      border-width: 2px 0 0 2px;
    }

    .hud-brackets::after {
      bottom: 0;
      right: 0;
      border-width: 0 2px 2px 0;
    }

    /* Glassmorphism Panel (Orbital-Glass inspired) */
    .glass-panel {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(51, 65, 85, 0.5);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    /* Scan Line Effect (Bio-System inspired) */
    .scan-overlay::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.5), transparent);
      animation: scanLine 3s linear infinite;
      pointer-events: none;
    }

    /* Terminal Log Entry Style (eclipse-command inspired) */
    .terminal-entry {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 8px 12px;
      border-left: 2px solid rgba(51, 65, 85, 0.5);
      transition: all 0.2s ease;
    }

    .terminal-entry:hover {
      background: rgba(30, 41, 59, 0.5);
      border-left-color: rgba(6, 182, 212, 0.8);
    }

    /* Floating Card Animation (Orbital-Glass inspired) */
    .float-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .float-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(6, 182, 212, 0.1);
    }
  </style>
</head>

<body class="bg-slate-950 text-gray-100">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
