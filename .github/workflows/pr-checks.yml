name: Pull Request Checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build dashboard
        run: npm run build
      - name: Verify static assets
        run: test -f dist/index.html && test -d dist/assets
      - name: Verify Worker bundle without publishing
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
