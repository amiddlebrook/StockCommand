name: Pull Request Checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build dashboard
        run: npm run build
      - name: Verify static assets
        run: test -f dist/index.html && test -d dist/assets
      - name: Verify Worker bundle without publishing
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Start local Cloudflare Worker
        run: |
          nohup npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/stockcommand-worker.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/stockcommand-worker.log
          exit 1
      - name: Verify browser interactions and corrupted-state recovery
        env:
          BASE_URL: http://127.0.0.1:8787
        run: node scripts/browser-smoke.mjs
      - name: Save browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockcommand-pr-browser
          path: test-artifacts/
          if-no-files-found: ignore
